name: Uploader

on:
  repository_dispatch:
    types: [Uploader]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space for Large Files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install System Dependencies
        run: |
          set -e

          echo "::group::Configure APT retry/timeouts"
          sudo tee /etc/apt/apt.conf.d/99-ci-retry.conf > /dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          DPkg::Lock::Timeout "120";
          EOF
          echo "::endgroup::"

          echo "::group::Mirror reachability check"
          switch_mirror() {
            echo "Switching sources to https://mirrors.edge.kernel.org/ubuntu ..."
            # Ubuntu 22.04 / 24.04 (sources.list)
            if [ -f /etc/apt/sources.list ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' \
                -e 's|http://archive.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' \
                -e 's|http://security.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' \
                /etc/apt/sources.list
            fi
            # Ubuntu 24.04+ deb822 format
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' \
                -e 's|http://archive.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' \
                -e 's|http://security.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' \
                /etc/apt/sources.list.d/ubuntu.sources
            fi
          }

          # Probe each default host; if any fails, switch to kernel.org
          NEED_SWITCH=0
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if ! getent hosts "$host" > /dev/null 2>&1; then
              echo "::warning::DNS lookup for $host failed"
              NEED_SWITCH=1
            fi
          done
          if [ "$NEED_SWITCH" -eq 1 ]; then
            switch_mirror
          fi
          echo "::endgroup::"

          echo "::group::Install packages with retry"
          MAX_ATTEMPTS=4
          ATTEMPT=1
          INSTALL_OK=0
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "--- Attempt $ATTEMPT / $MAX_ATTEMPTS ---"
            if sudo apt-get update \
               && sudo apt-get install -y --no-install-recommends git ffmpeg wget jq; then
              INSTALL_OK=1
              break
            fi
            echo "::warning::APT attempt $ATTEMPT failed. Retrying in $((ATTEMPT * 10))s ..."
            sleep $((ATTEMPT * 10))
            # On the 2nd failure, force the fallback mirror as well
            if [ "$ATTEMPT" -ge 2 ] && [ "$NEED_SWITCH" -eq 0 ]; then
              echo "::warning::Forcing mirror switch after repeated failures."
              switch_mirror
              NEED_SWITCH=1
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$INSTALL_OK" -ne 1 ]; then
            echo "::error::APT install failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Python & Node deps"
          pip install requests > /dev/null 2>&1
          npm install googleapis axios form-data nodemailer > /dev/null 2>&1
          echo "::endgroup::"

      - name: Download and Reassemble Video Chunks
        env:
          VIDEO_URLS: "${{ github.event.client_payload.video_urls }}"
          TARGET_FILENAME: "${{ github.event.client_payload.filename }}"
          VIDEO_TITLE: "${{ github.event.client_payload.title }}"
          YOUTUBE_CLIENT_ID: "${{ secrets.YOUTUBE_CLIENT_ID }}"
          YOUTUBE_CLIENT_SECRET: "${{ secrets.YOUTUBE_CLIENT_SECRET }}"
          YOUTUBE_REFRESH_TOKEN: "${{ secrets.YOUTUBE_REFRESH_TOKEN }}"
          VIDEO_DESCRIPTION: "${{ secrets.VIDEO_DESCRIPTION }}"
          VIDEO_VISIBILITY: "${{ secrets.VIDEO_VISIBILITY }}"
          MEGA_EMAIL: "${{ secrets.MEGA_EMAIL }}"
          MEGA_PASSWORD: "${{ secrets.MEGA_PASSWORD }}"
          MEGA_EMAIL_2: "${{ secrets.MEGA_EMAIL_2 }}"
          MEGA_PASSWORD_2: "${{ secrets.MEGA_PASSWORD_2 }}"
          MEGA_EMAIL_3: "${{ secrets.MEGA_EMAIL_3 }}"
          MEGA_PASSWORD_3: "${{ secrets.MEGA_PASSWORD_3 }}"
          MEGA_EMAIL_4: "${{ secrets.MEGA_EMAIL_4 }}"
          MEGA_PASSWORD_4: "${{ secrets.MEGA_PASSWORD_4 }}"
          MEGA_EMAIL_5: "${{ secrets.MEGA_EMAIL_5 }}"
          MEGA_PASSWORD_5: "${{ secrets.MEGA_PASSWORD_5 }}"
          GOFILE_API_TOKEN: "${{ secrets.GOFILE_API_TOKEN }}"
          GOFILE_FOLDER_ID: "${{ secrets.GOFILE_FOLDER_ID }}"
          GMAIL_USER: "${{ secrets.GMAIL_USER }}"
          GMAIL_APP_PASSWORD: "${{ secrets.GMAIL_APP_PASSWORD }}"
          EMAIL_TO: "${{ secrets.EMAIL_TO }}"
          TERM: "xterm"
        run: |
          mkdir -p downloads

          if [ -z "$VIDEO_URLS" ]; then
            echo "::error::No VIDEO_URLS provided in payload."
            exit 1
          fi

          echo "Downloading parts..."
          IFS=',' read -ra URL_ARRAY <<< "$VIDEO_URLS"

          for url in "${URL_ARRAY[@]}"; do
            part_name=$(basename "$url")
            echo "Downloading: $part_name"
            wget --no-verbose --tries=3 --timeout=30 -O "downloads/$part_name" "$url"
          done

          echo "Combining video chunks..."
          cd downloads

          rm -f "$TARGET_FILENAME"

          if ls -1 | grep -q "part"; then
            FILES=$(ls -v | grep "part")
          else
            FILES=$(ls -v)
          fi

          if [ -z "$FILES" ]; then
            echo "::error::No files found in downloads directory to combine."
            ls -la
            exit 1
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ "$f" = "$TARGET_FILENAME" ] && continue
            echo "Appending $f..."
            cat "$f" >> "$TARGET_FILENAME"
          done <<< "$FILES"

          cd ..

          DOWNLOADED_FILE="downloads/$TARGET_FILENAME"

          if [ ! -f "$DOWNLOADED_FILE" ]; then
            echo "::error::Reassembly failed. File not found."
            ls -la downloads || true
            exit 1
          fi

          echo "File reassembled successfully: $DOWNLOADED_FILE ($(du -h "$DOWNLOADED_FILE" | cut -f1))"
          echo "Attempting YouTube upload..."

          node -e '
          const { execSync } = require("child_process");
          const fs = require("fs");
          const path = require("path");
          const axios = require("axios");
          const FormData = require("form-data");
          const nodemailer = require("nodemailer");
          const { google } = require("googleapis");

          // ---------- MEGA fallback ----------
          function runSafe(cmd) {
            try { execSync(cmd, { stdio: "ignore" }); return true; }
            catch (e) { return false; }
          }

          function installMegaCmd() {
            if (runSafe("which mega-login")) return true;

            const MEGA_DEB = "/tmp/megacmd.deb";
            const MEGA_URL =
              "https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb";

            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                console.log(`Downloading megacmd (attempt ${attempt}) ...`);
                execSync(
                  `wget --no-verbose --tries=2 --timeout=30 -O ${MEGA_DEB} ${MEGA_URL}`,
                  { stdio: "ignore" }
                );
                execSync(`sudo apt-get install -y ${MEGA_DEB} > /dev/null 2>&1`, {
                  stdio: "ignore",
                });
                execSync(`rm -f ${MEGA_DEB}`, { stdio: "ignore" });
                if (runSafe("which mega-login")) return true;
              } catch (e) {
                console.log(`megacmd install attempt ${attempt} failed`);
                try { execSync(`rm -f ${MEGA_DEB}`, { stdio: "ignore" }); } catch (_) {}
                execSync(`sleep ${attempt * 5}`, { stdio: "ignore" });
              }
            }
            return false;
          }

          async function uploadToMega(filePath) {
            if (!installMegaCmd()) {
              console.log("megacmd unavailable, skipping MEGA fallback");
              return;
            }

            const megaAccounts = [
              { email: process.env.MEGA_EMAIL, pass: process.env.MEGA_PASSWORD },
              { email: process.env.MEGA_EMAIL_2, pass: process.env.MEGA_PASSWORD_2 },
              { email: process.env.MEGA_EMAIL_3, pass: process.env.MEGA_PASSWORD_3 },
              { email: process.env.MEGA_EMAIL_4, pass: process.env.MEGA_PASSWORD_4 },
              { email: process.env.MEGA_EMAIL_5, pass: process.env.MEGA_PASSWORD_5 }
            ].filter(acc => acc.email && acc.pass);

            if (megaAccounts.length === 0) return;

            for (let i = 0; i < megaAccounts.length; i++) {
              const acc = megaAccounts[i];
              try {
                runSafe("mega-logout");
                execSync(`mega-login "${acc.email}" "${acc.pass}"`, { stdio: "ignore" });
                execSync(`mega-put "${filePath}" /`, { stdio: "ignore" });
                runSafe("mega-logout");
                console.log(`MEGA upload succeeded on account #${i + 1}`);
                return;
              } catch (err) {
                runSafe("mega-logout");
                console.log(`MEGA account #${i + 1} failed, trying next`);
              }
            }
          }

          // ---------- Gofile upload (token-authenticated) + email ----------
          async function uploadToGofileAndEmail(filePath) {
            const gofileToken  = process.env.GOFILE_API_TOKEN;
            const gofileFolder = process.env.GOFILE_FOLDER_ID || "";

            if (!gofileToken) return;

            let downloadPage = null;
            let shareCode    = null;

            try {
              const form = new FormData();
              form.append("file", fs.createReadStream(filePath));
              form.append("token", gofileToken);
              if (gofileFolder) form.append("folderId", gofileFolder);

              const headers = form.getHeaders();
              headers["Authorization"] = `Bearer ${gofileToken}`;

              const res = await axios.post(
                "https://upload.gofile.io/uploadfile",
                form,
                {
                  headers,
                  maxBodyLength: Infinity,
                  maxContentLength: Infinity,
                  timeout: 0,
                }
              );

              if (!res.data || res.data.status !== "ok") return;

              downloadPage = res.data.data?.downloadPage;
              shareCode    = res.data.data?.code;
              if (!downloadPage) return;
            } catch (err) {
              return;
            }

            const gmailUser = process.env.GMAIL_USER;
            const gmailPass = process.env.GMAIL_APP_PASSWORD;
            const emailTo   = process.env.EMAIL_TO;

            if (!gmailUser || !gmailPass || !emailTo) return;

            try {
              const transporter = nodemailer.createTransport({
                service: "gmail",
                auth: { user: gmailUser, pass: gmailPass },
              });

              const sizeMB   = (fs.statSync(filePath).size / 1024 / 1024).toFixed(2);
              const fileName = path.basename(filePath);

              await transporter.sendMail({
                from: gmailUser,
                to: emailTo,
                subject: `Video Fallback Upload - ${fileName}`,
                text:
                  `YouTube upload failed, but the video was uploaded to Gofile.\n\n` +
                  `File      : ${fileName}\n` +
                  `Size      : ${sizeMB} MB\n` +
                  `Share code: ${shareCode || "n/a"}\n` +
                  `Link      : ${downloadPage}\n\n` +
                  `You can re-download the video from the link above.\n`,
              });
              console.log("Fallback email sent to", emailTo);
            } catch (err) {
              console.log("Fallback email failed:", err.message);
            }
          }

          // ---------- YouTube upload ----------
          async function uploadVideo() {
            const clientId     = process.env.YOUTUBE_CLIENT_ID;
            const clientSecret = process.env.YOUTUBE_CLIENT_SECRET;
            const refreshToken = process.env.YOUTUBE_REFRESH_TOKEN;

            const filePath = path.join(__dirname, "downloads", process.env.TARGET_FILENAME || "");
            const fileSize = fs.statSync(filePath).size;
            console.log(`Video size: ${(fileSize / 1024 / 1024).toFixed(2)} MB`);

            if (!clientId || !clientSecret || !refreshToken) {
              console.log("YouTube credentials missing; using fallbacks");
              await uploadToMega(filePath);
              await uploadToGofileAndEmail(filePath);
              return;
            }

            const oauth2Client = new google.auth.OAuth2(clientId, clientSecret);
            oauth2Client.setCredentials({ refresh_token: refreshToken });
            const youtube = google.youtube({ version: "v3", auth: oauth2Client });

            try {
              await youtube.videos.insert(
                {
                  part: "snippet,status",
                  requestBody: {
                    snippet: {
                      title: process.env.VIDEO_TITLE,
                      description: process.env.VIDEO_DESCRIPTION || "Automated Upload",
                      categoryId: "27",
                    },
                    status: { privacyStatus: process.env.VIDEO_VISIBILITY || "unlisted" },
                  },
                  media: { body: fs.createReadStream(filePath) },
                },
                { onUploadProgress: () => {} }
              );
              console.log("YouTube upload succeeded");
            } catch (error) {
              console.log("YouTube upload failed:", error.message);
              await uploadToMega(filePath);
              await uploadToGofileAndEmail(filePath);
            }
          }

          uploadVideo().catch(err => {
            console.error("Fatal error:", err);
            process.exit(1);
          });
          '

      - name: Cleanup GitHub Release
        if: always()
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          VIDEO_URLS: "${{ github.event.client_payload.video_urls }}"
        run: |
          if [ -z "$VIDEO_URLS" ]; then
            exit 0
          fi

          IFS=',' read -ra URL_ARRAY <<< "$VIDEO_URLS"
          TAG_NAME=$(echo "${URL_ARRAY[0]}" | awk -F'/' '{print $8}')

          if [ -z "$TAG_NAME" ]; then
            exit 0
          fi

          REPO="${{ github.repository }}"
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG_NAME" | jq -r '.id')

          if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$RELEASE_ID"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/git/refs/tags/$TAG_NAME"
            echo "Cleanup completed successfully!"
          fi
